name: CI

on:
  push:
    branches: [main]
    tags: ['v*']   # a release tag runs CI with the signature-freshness gate in STRICT mode
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deno:
    name: Deno (type-check apps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check apps
        run: deno check apps/worker/worker.ts apps/worker/vision_wgsl.ts apps/coordinator/server.ts

  webgpu:
    name: WebGPU vision (lavapipe + SwiftShader) + mixed torch/WebGPU fleet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Software Vulkan adapter (Mesa lavapipe) for Deno/wgpu
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps (npm; CPU torch + MONAI for the torch worker and the lowering)
        run: |
          npm ci
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install cryptography websockets numpy safetensors monai 'transformers>=4.44,<5' onnx onnxruntime onnxscript scipy

      - name: Deno sees a WebGPU adapter (fails loudly if lavapipe is missing, instead of silently ignoring the GPU tests)
        run: |
          echo "const a = await navigator.gpu?.requestAdapter(); if (!a) { console.error('no WebGPU adapter'); Deno.exit(1); } console.log('adapter:', a.info?.description);" > /tmp/adapter.ts
          deno run --unstable-webgpu /tmp/adapter.ts

      - name: Real WGSL on lavapipe — kernel goldens, tiling, UNet/seg/ViT parity, python-lowered graphs, sliding window; worker e2e
        run: deno test --unstable-webgpu -A tests/webgpu/deno_webgpu_test.ts tests/webgpu/deno_worker_e2e_test.ts

      - name: Browser WebGPU (headless Chromium, SwiftShader)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c tests/webgpu/playwright.config.ts

      - name: Mixed fleet — 1 torch + 1 Deno WebGPU worker, /vision/load fleet=all, /vision/infer_batch == torch (≤1e-4)
        run: python3 tests/e2e/mixed_fleet_vision.py

  native:
    name: Native torch worker (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker deps (CPU torch — no models downloaded)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # transformers pinned <5: MoE expert parallelism addresses experts by per-expert tensor name
          # (experts.<N>.gate_proj…), which transformers 5.x fuses into a single batched `Experts` module.
          # Sharding/serving/training work on 4.x AND 5.x; MoE EP currently needs the 4.x OLMoE ModuleList layout.
          pip install cryptography websockets numpy 'transformers>=4.44,<5' safetensors
          # vision / training-task framework test deps (ADR-0102); GPU/WebGPU-marked tests skip on CI runners
          pip install pytest pytest-cov jsonschema scipy nibabel pillow tifffile onnx onnxruntime onnxscript monai timm

      - name: Research boundary (ADR-0101) — no study/dataset terms, copyleft code or medical images outside docs/case-studies
        run: python3 -m pytest -q tests/boundary

      - name: Unsafe-deserialisation ban (ADR-0113) — no weights_only=False, pickle.load(s), trust_remote_code, bare torch.load
        run: python3 -m pytest -q tests/security/pickle_ban_test.py

      - name: Worker library unit tests (pytest, ≥90% coverage of moregpu_worker)
        run: python3 -m pytest -q tests/py --cov=moregpu_worker --cov-config=apps/worker/.coveragerc --cov-fail-under=90

      - name: Compile-check native code
        run: python -m py_compile apps/worker/worker_torch.py examples/*.py clients/python/moregpu/__init__.py

      - name: Generic training sessions — coordinator DiLoCo == in-process reference, resume, isolation, churn
        run: python3 tests/e2e/train_sessions.py

      - name: JEPA pretraining — 2 workers via coordinator == in-process reference, identical EMA targets, export
        run: python3 tests/e2e/jepa_sessions.py

      - name: Data plane — JEPA on file:// + pushed:// data, path escape refused, per-worker caps
        run: python3 tests/e2e/data_plane_jepa.py

      - name: Vision pipeline — JEPA → segment fine-tune → /vision/batch across 3 workers with a worker killed mid-batch
        run: python3 tests/e2e/vision_pipeline.py

      - name: Published model — MONAI state_dict served natively via /vision, malicious pickle + sha mismatch refused
        run: python3 tests/e2e/published_model.py

      - name: CLI — moregpu train jepa|segment|status, net, models describe, vision load/batch --split tiles
        run: python3 tests/e2e/cli_train.py

      - name: Torch worker smoke (coordinator + CPU torch worker + verified kernels)
        run: bash scripts/smoke_torch.sh

      - name: Download-free shard exact-match parity (GPT-2 + Llama + multi-file, no model download)
        run: python3 tests/e2e/shard_parity.py

      - name: Churn-resume — mid-stream drop recovery (resume from staged bytes)
        run: python3 tests/fault/churn_resume.py

      - name: Post-load failover — kill a stage mid-generation, re-place, output matches golden
        run: python3 tests/fault/postload_failover.py

      - name: Sharded-chat coherence — sharded chat/generate == un-sharded golden
        run: python3 tests/e2e/chat_coherence.py

      - name: Seal negatives — tampered ciphertext / bad-or-replayed signature rejected
        run: python3 tests/security/seal_negatives.py

      - name: Release verify — supply-chain gate (always); worker.ts signature-freshness (hard only on a release tag)
        env:
          MOREGPU_RELEASE_STRICT: ${{ github.ref_type == 'tag' && '1' || '0' }}
        run: python3 tests/security/release_verify.py

      - name: TLS default — self-signed wss + worker cert pinning; wrong pin refused; ws:// opt-out intact
        run: python3 tests/security/tls_default.py

      - name: TLS install path — Deno worker.ts joins default self-signed wss (DENO_CERT), wrong cert refused
        run: python3 tests/security/tls_install_path.py

      - name: Per-worker keys — HKDF per-worker sealing keys, cross-worker unseal fails, revocation rotates epoch
        run: python3 tests/security/per_worker_keys.py

      - name: Fake-WS fleet scale — 150 no-torch nodes, connect storm + churn, control plane holds
        run: python3 tests/scale/fake_fleet.py

      - name: Peer transport (opt-in) — worker->worker handoff == golden, 0 coordinator relays
        run: python3 tests/e2e/peer_transport.py

      - name: MoE expert parallelism — experts placed across nodes, forward == un-sharded MoE
        run: python3 tests/e2e/moe_expert_parity.py

      - name: KV-over-peer + mixed-pipe — cached decode over the ring == golden, 0 relays
        run: python3 tests/e2e/peer_kv.py

      - name: MoE all-to-all over peer — expert dispatch worker->worker == golden, 0 relays
        run: python3 tests/e2e/moe_peer.py

      - name: Peer NAT — multi-candidate endpoints + reflexive /whoami; dead-first candidate falls through to direct
        run: python3 tests/e2e/peer_nat.py

      - name: DiLoCo LoRA training — loss decreases + non-finite guard
        run: python3 tests/e2e/train_diloco.py

      - name: KV-cache parity — cached == uncached == un-sharded golden (O(n^2)->O(n))
        run: python3 tests/e2e/kv_cache_parity.py

      - name: Serve parity — single-node download-free serving == un-sharded golden (forward + generate)
        run: python3 tests/e2e/serve_parity.py

      - name: Single-worker LoRA — /train/load+step+adapter learns (loss decreases, adapter trained)
        run: python3 tests/e2e/train_single.py

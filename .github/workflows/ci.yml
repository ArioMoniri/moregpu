name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  node:
    name: Node (build + test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deno:
    name: Deno (type-check apps)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check apps
        run: deno check apps/worker/worker.ts apps/coordinator/server.ts

  native:
    name: Native torch worker (smoke)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install worker deps (CPU torch — no models downloaded)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install cryptography websockets numpy transformers safetensors

      - name: Compile-check native code
        run: python -m py_compile apps/worker/worker_torch.py examples/*.py clients/python/moregpu/__init__.py

      - name: Torch worker smoke (coordinator + CPU torch worker + verified kernels)
        run: bash scripts/smoke_torch.sh

      - name: Download-free shard exact-match parity (GPT-2 + Llama + multi-file, no model download)
        run: python3 tests/e2e/shard_parity.py

      - name: Churn-resume — mid-stream drop recovery (resume from staged bytes)
        run: python3 tests/fault/churn_resume.py

      - name: Post-load failover — kill a stage mid-generation, re-place, output matches golden
        run: python3 tests/fault/postload_failover.py

      - name: Sharded-chat coherence — sharded chat/generate == un-sharded golden
        run: python3 tests/e2e/chat_coherence.py

      - name: Seal negatives — tampered ciphertext / bad-or-replayed signature rejected
        run: python3 tests/security/seal_negatives.py

      - name: Fake-WS fleet scale — 150 no-torch nodes, connect storm + churn, control plane holds
        run: python3 tests/scale/fake_fleet.py

      - name: Peer transport (opt-in) — worker->worker handoff == golden, 0 coordinator relays
        run: python3 tests/e2e/peer_transport.py

      - name: DiLoCo LoRA training — loss decreases + non-finite guard
        run: python3 tests/e2e/train_diloco.py

      - name: KV-cache parity — cached == uncached == un-sharded golden (O(n^2)->O(n))
        run: python3 tests/e2e/kv_cache_parity.py

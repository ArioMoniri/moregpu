name: container

# Publish the MoreGPU coordinator image to GitHub Container Registry (ghcr.io). Pushing from the repo's
# own workflow links the package to this repository (so it shows in the repo's Packages sidebar).
on:
  release:
    types: [published]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/moregpu
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
            type=raw,value=0.6.0
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

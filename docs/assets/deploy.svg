<svg viewBox="0 0 1120 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/></filter>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/></marker>
  </defs>
  <rect width="1120" height="420" rx="16" fill="#f8fafc"/>
  <text x="48" y="52" font-size="21" font-weight="700" fill="#0f172a" letter-spacing="-0.3">Deployment — outbound-only workers, one isolated pool</text>
  <text x="48" y="76" font-size="13.5" fill="#64748b">Each machine dials OUT to your admin server with the join token. No inbound port is ever opened on a worker.</text>

  <!-- worker cards (left) -->
  <g>
    <g filter="url(#ds)"><rect x="48" y="112" width="250" height="70" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.4"/></g>
    <circle cx="72" cy="147" r="5" fill="#10b981"/><text x="88" y="143" font-size="14.5" font-weight="650" fill="#0f172a">Linux worker</text>
    <text x="88" y="163" font-size="12" fill="#64748b">GPU (WebGPU) or CPU fallback</text>

    <g filter="url(#ds)"><rect x="48" y="196" width="250" height="70" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.4"/></g>
    <circle cx="72" cy="231" r="5" fill="#10b981"/><text x="88" y="227" font-size="14.5" font-weight="650" fill="#0f172a">macOS worker</text>
    <text x="88" y="247" font-size="12" fill="#64748b">Apple GPU (Metal) or CPU</text>

    <g filter="url(#ds)"><rect x="48" y="280" width="250" height="70" rx="12" fill="#fff" stroke="#e2e8f0" stroke-width="1.4"/></g>
    <circle cx="72" cy="315" r="5" fill="#f59e0b"/><text x="88" y="311" font-size="14.5" font-weight="650" fill="#0f172a">Windows worker</text>
    <text x="88" y="331" font-size="12" fill="#64748b">GPU (D3D12/Vulkan) or CPU</text>
  </g>

  <!-- arrows to server -->
  <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#ar)">
    <path d="M298 147 C 430 147, 470 210, 618 220"/>
    <path d="M298 231 H 618"/>
    <path d="M298 315 C 430 315, 470 252, 618 242"/>
  </g>
  <text x="360" y="140" font-size="11.5" fill="#4f46e5">outbound wss + join token</text>
  <text x="360" y="222" font-size="11.5" fill="#4f46e5">outbound wss + join token</text>
  <text x="360" y="336" font-size="11.5" fill="#4f46e5">outbound wss + join token</text>

  <!-- admin server (right) -->
  <g filter="url(#ds)"><rect x="626" y="176" width="300" height="118" rx="14" fill="#fff" stroke="#c7d2fe" stroke-width="1.6"/></g>
  <rect x="626" y="176" width="300" height="6" rx="3" fill="#4f46e5"/>
  <text x="776" y="212" font-size="16" font-weight="700" fill="#0f172a" text-anchor="middle">Admin server</text>
  <text x="776" y="234" font-size="12.5" fill="#64748b" text-anchor="middle">your isolated pool · own tokens + key</text>
  <text x="776" y="256" font-size="12" fill="#475569" text-anchor="middle">dashboard · job API · shard · seal · pool</text>
  <text x="776" y="277" font-size="11.5" fill="#10b981" text-anchor="middle">virtual GPU · Prometheus /metrics</text>

  <!-- admin submit -->
  <g stroke="#2a9d55" stroke-width="1.8" fill="none" marker-end="url(#ar)"><path d="M1000 235 H 936"/></g>
  <g filter="url(#ds)"><rect x="1000" y="212" width="88" height="46" rx="10" fill="#fff" stroke="#e2e8f0" stroke-width="1.4"/></g>
  <text x="1044" y="233" font-size="12.5" font-weight="600" fill="#0f172a" text-anchor="middle">admin</text>
  <text x="1044" y="249" font-size="10.5" fill="#64748b" text-anchor="middle">pushes jobs</text>
</svg>

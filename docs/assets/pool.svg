<svg viewBox="0 0 1280 520" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="520" rx="16" fill="#ffffff"/>
  <rect width="1280" height="520" rx="16" fill="#f8fafc"/>
  <text x="56" y="56" font-size="24" font-weight="700" fill="#0f172a" letter-spacing="-0.3">MoreGPU — native GPU compute pool</text>
  <text x="56" y="82" font-size="14.5" fill="#64748b">Real WGSL kernels run on your GPUs, sharded across nodes and pooled back into one result.</text>

  <!-- 1. Client -->
  <g filter="url(#sh)">
    <rect x="56" y="150" width="180" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <rect x="56" y="150" width="180" height="6" rx="3" fill="url(#accent)"/>
  <text x="80" y="192" font-size="15" font-weight="650" fill="#0f172a">Client</text>
  <text x="80" y="216" font-size="12.5" fill="#64748b">submit a compute job</text>
  <g font-family="ui-monospace, monospace" font-size="11.5" fill="#4f46e5">
    <text x="80" y="246">matmul 4096³</text>
    <text x="80" y="266">embeddings ×10⁶</text>
    <text x="80" y="286">Monte Carlo</text>
  </g>

  <path d="M244 225 H300" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arw)"/>

  <!-- 2. Coordinator -->
  <g filter="url(#sh)">
    <rect x="308" y="150" width="220" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <rect x="308" y="150" width="220" height="6" rx="3" fill="url(#accent)"/>
  <text x="332" y="192" font-size="15" font-weight="650" fill="#0f172a">Coordinator</text>
  <text x="332" y="216" font-size="12.5" fill="#64748b">shard · schedule · pool</text>
  <g font-size="11.5" fill="#475569">
    <text x="332" y="244">▸ split into work units</text>
    <text x="332" y="264">▸ assign by capacity</text>
    <text x="332" y="284">▸ reissue on timeout</text>
  </g>

  <path d="M536 225 H596" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arw)"/>

  <!-- 3. Worker fleet -->
  <g filter="url(#sh)">
    <rect x="604" y="128" width="384" height="264" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <text x="628" y="158" font-size="13" font-weight="650" fill="#0f172a">Worker fleet</text>
  <text x="792" y="158" font-size="11.5" fill="#94a3b8">headless · true-idle · yields on keystroke</text>

  <!-- worker cards -->
  <g>
    <!-- w1 -->
    <rect x="628" y="176" width="160" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
    <circle cx="648" cy="198" r="5" fill="#10b981"/>
    <text x="662" y="202" font-size="12.5" font-weight="600" fill="#0f172a">worker-0</text>
    <text x="648" y="226" font-size="11" font-family="ui-monospace, monospace" fill="#4f46e5">WGSL → GPU</text>
    <text x="648" y="248" font-size="10.5" fill="#64748b">NVIDIA · Metal · Vulkan</text>
    <!-- w2 -->
    <rect x="804" y="176" width="160" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
    <circle cx="824" cy="198" r="5" fill="#10b981"/>
    <text x="838" y="202" font-size="12.5" font-weight="600" fill="#0f172a">worker-1</text>
    <text x="824" y="226" font-size="11" font-family="ui-monospace, monospace" fill="#4f46e5">WGSL → GPU</text>
    <text x="824" y="248" font-size="10.5" fill="#64748b">discrete / integrated</text>
    <!-- w3 -->
    <rect x="628" y="284" width="160" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
    <circle cx="648" cy="306" r="5" fill="#10b981"/>
    <text x="662" y="310" font-size="12.5" font-weight="600" fill="#0f172a">worker-2</text>
    <text x="648" y="334" font-size="11" font-family="ui-monospace, monospace" fill="#4f46e5">WGSL → GPU</text>
    <text x="648" y="356" font-size="10.5" fill="#64748b">Apple M-series</text>
    <!-- w4 (cpu fallback) -->
    <rect x="804" y="284" width="160" height="90" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.3"/>
    <circle cx="824" cy="306" r="5" fill="#f59e0b"/>
    <text x="838" y="310" font-size="12.5" font-weight="600" fill="#0f172a">worker-3</text>
    <text x="824" y="334" font-size="11" font-family="ui-monospace, monospace" fill="#0ea5e9">WASM → CPU</text>
    <text x="824" y="356" font-size="10.5" fill="#64748b">no-GPU fallback</text>
  </g>

  <path d="M996 225 H1056" stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arw)"/>

  <!-- 4. Pooled result -->
  <g filter="url(#sh)">
    <rect x="1064" y="150" width="160" height="150" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  </g>
  <rect x="1064" y="150" width="160" height="6" rx="3" fill="#10b981"/>
  <text x="1088" y="192" font-size="15" font-weight="650" fill="#0f172a">Result</text>
  <text x="1088" y="216" font-size="12.5" fill="#64748b">pooled + verified</text>
  <g font-size="11.5" fill="#475569">
    <text x="1088" y="246">tree-reduce</text>
    <text x="1088" y="266">quorum check</text>
    <text x="1088" y="286">↩ back to client</text>
  </g>

  <!-- footer strip: verified demo numbers -->
  <rect x="56" y="430" width="1168" height="52" rx="10" fill="#0f172a"/>
  <text x="80" y="462" font-size="13" font-family="ui-monospace, monospace" fill="#e2e8f0">
    <tspan fill="#a5b4fc">verified · </tspan>1024³ matmul sharded over 4 workers → pooled in 52.6 ms · ~41 GFLOP/s aggregate · maxAbsDiff 5.2e-4 vs CPU
    <tspan fill="#34d399">  ✓ MATCH</tspan>
  </text>
</svg>

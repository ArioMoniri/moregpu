<svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="960" height="420" rx="16" fill="#0e1117"/>
  <text x="34" y="42" fill="#e6edf3" font-size="20" font-weight="700" letter-spacing="-0.3">How MoreGPU runs a job</text>
  <text x="34" y="64" fill="#8b98ad" font-size="13">submit → shard → seal → compute on GPU/CPU → pool → verify</text>

  <!-- connective pipeline -->
  <g stroke="#232b39" stroke-width="2" fill="none">
    <path d="M150 200 H360"/>
    <path d="M470 200 C 560 200, 560 130, 660 130"/>
    <path d="M470 200 C 560 200, 560 200, 660 200"/>
    <path d="M470 200 C 560 200, 560 270, 660 270"/>
    <path d="M770 130 C 850 130, 850 200, 890 200"/>
    <path d="M770 200 H890"/>
    <path d="M770 270 C 850 270, 850 200, 890 200"/>
  </g>

  <!-- nodes -->
  <g>
    <!-- admin -->
    <rect x="40" y="176" width="110" height="48" rx="10" fill="#161b26" stroke="#2b3444"/>
    <text x="95" y="205" fill="#c9d4e3" font-size="13" text-anchor="middle">Admin</text>
    <!-- coordinator -->
    <rect x="360" y="168" width="110" height="64" rx="10" fill="#161b26" stroke="#3b3f6b"/>
    <text x="415" y="196" fill="#c9d4e3" font-size="13" text-anchor="middle">Coordinator</text>
    <text x="415" y="214" fill="#8b98ad" font-size="10" text-anchor="middle">shard · seal</text>
    <!-- workers -->
    <g>
      <rect x="660" y="108" width="110" height="44" rx="10" fill="#12211b" stroke="#1f6f4a"/>
      <text x="715" y="135" fill="#7ee2b8" font-size="12" text-anchor="middle">worker · GPU</text>
      <circle cx="672" cy="130" r="4" fill="#34d399"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="3.4s" repeatCount="indefinite"/></circle>
      <rect x="660" y="178" width="110" height="44" rx="10" fill="#12211b" stroke="#1f6f4a"/>
      <text x="715" y="205" fill="#7ee2b8" font-size="12" text-anchor="middle">worker · GPU</text>
      <circle cx="672" cy="200" r="4" fill="#34d399"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="3.6s" repeatCount="indefinite"/></circle>
      <rect x="660" y="248" width="110" height="44" rx="10" fill="#251f12" stroke="#8a6a1f"/>
      <text x="715" y="275" fill="#f5cf7a" font-size="12" text-anchor="middle">worker · CPU</text>
      <circle cx="672" cy="270" r="4" fill="#fbbf24"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" begin="3.8s" repeatCount="indefinite"/></circle>
    </g>
    <!-- pool -->
    <rect x="890" y="176" width="60" height="48" rx="10" fill="#161b26" stroke="#2b3444" transform="translate(-30,0)"/>
    <text x="890" y="198" fill="#c9d4e3" font-size="12" text-anchor="middle">pool</text>
    <text x="890" y="214" fill="#34d399" font-size="11" text-anchor="middle">✓</text>
  </g>

  <!-- the job packet: admin → coordinator -->
  <circle r="6" fill="#6366f1">
    <animateMotion path="M150 200 H360" dur="1.4s" begin="0s;9s;18s;27s;36s;45s;54s;63s;72s;81s" fill="freeze"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="0s;9s;18s;27s;36s;45s;54s;63s;72s;81s"/>
  </circle>

  <!-- three sealed shards: coordinator → workers (staggered) -->
  <g>
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#f59e0b">
      <animateMotion path="M470 200 C 560 200, 560 130, 660 130" dur="1.5s" begin="1.6s;10.6s;19.6s;28.6s;37.6s;46.6s;55.6s;64.6s;73.6s;82.6s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.5s" begin="1.6s;10.6s;19.6s;28.6s;37.6s;46.6s;55.6s;64.6s;73.6s;82.6s"/>
    </rect>
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#f59e0b">
      <animateMotion path="M470 200 C 560 200, 560 200, 660 200" dur="1.5s" begin="1.75s;10.75s;19.75s;28.75s;37.75s;46.75s;55.75s;64.75s;73.75s;82.75s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.5s" begin="1.75s;10.75s;19.75s;28.75s;37.75s;46.75s;55.75s;64.75s;73.75s;82.75s"/>
    </rect>
    <rect x="-5" y="-5" width="10" height="10" rx="2" fill="#f59e0b">
      <animateMotion path="M470 200 C 560 200, 560 270, 660 270" dur="1.5s" begin="1.9s;10.9s;19.9s;28.9s;37.9s;46.9s;55.9s;64.9s;73.9s;82.9s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.5s" begin="1.9s;10.9s;19.9s;28.9s;37.9s;46.9s;55.9s;64.9s;73.9s;82.9s"/>
    </rect>
  </g>
  <text x="500" y="120" fill="#f59e0b" font-size="10" opacity="0.85">🔒 sealed</text>

  <!-- results: workers → pool (after compute) -->
  <g>
    <circle r="5" fill="#34d399">
      <animateMotion path="M770 130 C 850 130, 850 200, 890 200" dur="1.4s" begin="5.2s;14.2s;23.2s;32.2s;41.2s;50.2s;59.2s;68.2s;77.2s;86.2s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="5.2s;14.2s;23.2s;32.2s;41.2s;50.2s;59.2s;68.2s;77.2s;86.2s"/>
    </circle>
    <circle r="5" fill="#34d399">
      <animateMotion path="M770 200 H890" dur="1.4s" begin="5.35s;14.35s;23.35s;32.35s;41.35s;50.35s;59.35s;68.35s;77.35s;86.35s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="5.35s;14.35s;23.35s;32.35s;41.35s;50.35s;59.35s;68.35s;77.35s;86.35s"/>
    </circle>
    <circle r="5" fill="#fbbf24">
      <animateMotion path="M770 270 C 850 270, 850 200, 890 200" dur="1.4s" begin="5.5s;14.5s;23.5s;32.5s;41.5s;50.5s;59.5s;68.5s;77.5s;86.5s"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="1.4s" begin="5.5s;14.5s;23.5s;32.5s;41.5s;50.5s;59.5s;68.5s;77.5s;86.5s"/>
    </circle>
  </g>

  <!-- pooled verified result pulse -->
  <circle cx="860" cy="200" r="10" fill="none" stroke="#34d399" stroke-width="2" opacity="0">
    <animate attributeName="r" values="6;18" dur="1s" begin="7s;16s;25s;34s;43s;52s;61s;70s;79s;88s"/>
    <animate attributeName="opacity" values="0.9;0" dur="1s" begin="7s;16s;25s;34s;43s;52s;61s;70s;79s;88s"/>
  </circle>

  <!-- footer caption -->
  <text x="34" y="392" fill="#8b98ad" font-size="12">Workers connect outbound with a join token · each work unit is AES-256-GCM sealed · pool duty adapts to each machine's own load</text>
</svg>

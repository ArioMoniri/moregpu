# Prometheus scrape config for a MoreGPU pool. __MG_TOKEN__/__MG_TARGET__ are substituted at container
# start from MOREGPU_ADMIN_TOKEN / MOREGPU_TARGET (Prometheus itself does not expand env vars in config).
global:
  scrape_interval: 5s
scrape_configs:
  - job_name: moregpu
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: __MG_TOKEN__
    static_configs:
      - targets: ["__MG_TARGET__"]

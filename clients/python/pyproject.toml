[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "moregpu-client"
version = "0.3.0"
description = "Client SDK + CLI for the MoreGPU distributed GPU compute pool"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "Ariorad Moniri" }]
keywords = ["gpu", "distributed-computing", "webgpu", "compute-pool", "moregpu"]
dependencies = []  # standard library only
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/ArioMoniri/moregpu"
Documentation = "https://ariomoniri.github.io/moregpu/"
Repository = "https://github.com/ArioMoniri/moregpu"

[project.scripts]
moregpu-client = "moregpu.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["moregpu"]
